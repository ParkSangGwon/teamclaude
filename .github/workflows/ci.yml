name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  node:
    name: node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # Cover the whole supported range — package.json declares "node >=20".
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # `--ignore-scripts`: eslint (the only devDependency) is needed for lint
      # only, and neither it nor its transitive packages need lifecycle scripts to
      # work. Not running them denies a compromised package arbitrary code
      # execution at install time. Still `npm install` rather than `npm ci`:
      # package-lock.json is deliberately gitignored for this zero-dependency
      # package, so there is no lockfile for `npm ci` to consume.
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Lint
        if: matrix.node == 24
        run: npm run lint

  nix:
    name: nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake check (package build + NixOS module VM test)
        run: nix flake check --no-update-lock-file -L

      - name: Smoke test the CLI wrapper
        run: nix run --no-update-lock-file .#teamclaude -- help

  # The macOS menu bar client under macos/ (SwiftPM, no dependencies). Built
  # unconditionally rather than path-filtered so the required `test` check
  # never reads as "skipped" on a PR that only touches src/.
  macos:
    name: macos app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Swift integration test and the snapshot script both spawn the proxy
      # from ../src, so pin the Node the package supports rather than rely on
      # whatever the runner image happens to ship.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release --package-path macos

      - name: Test
        run: swift test --package-path macos

      - name: Bundle smoke
        run: make -C macos app && plutil -lint "macos/dist/TeamClaude Bar.app/Contents/Info.plist"

      # Popover and settings panes rendered against a throwaway proxy, so a PR
      # review can see the UI without checking the branch out.
      - name: Snapshots
        run: make -C macos snapshots

      - name: Upload snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-snapshots
          path: macos/dist/snapshots

  # Single stable status check for branch protection to require, independent of
  # how many implementation jobs run. Always runs and fails explicitly if any
  # required job did not succeed (so it is never silently "skipped").
  test:
    name: test
    needs: [node, nix, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: needs.node.result != 'success' || needs.nix.result != 'success' || needs.macos.result != 'success'
        run: |
          echo "Node job result: ${{ needs.node.result }}"
          echo "Nix package result: ${{ needs.nix.result }}"
          echo "macOS app result: ${{ needs.macos.result }}"
          exit 1
      - run: echo "All required jobs passed"
